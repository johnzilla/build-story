name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays 06:00 UTC) so new advisories surface without a code change.
    - cron: '0 6 * * 1'

jobs:
  build:
    name: build · lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build first: cross-package typecheck and tests resolve each package
      # through its emitted dist/index.d.ts.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  video-acceptance:
    name: offline video acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDSTORY_ACCEPTANCE_DIR: ${{ github.workspace }}/acceptance-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check browser and install media tools
        run: |
          google-chrome --version
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build
        run: pnpm build
      - name: Render and verify synthetic fixture
        run: pnpm test:acceptance
      - name: Preserve render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-acceptance
          path: acceptance-artifacts/
          retention-days: 7
          if-no-files-found: warn

  audit:
    name: audit (high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on high-severity advisories. No advisories are currently ignored.
      - name: Audit (high)
        run: pnpm audit --audit-level=high
